name: CI

on:
  push:
    branches: [main, master, feat/**]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: https://github.com/dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: apt-get update && apt-get install -y --no-install-recommends libxkbcommon-dev
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test --all-features
      - run: cargo check --features gui --bin rustrepo-sanitizer-gui

  stable-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: https://github.com/dtolnay/rust-toolchain@stable
      - run: cargo check --all-features
      - run: cargo check --features gui --bin rustrepo-sanitizer-gui

  gui-xa11y:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: https://github.com/dtolnay/rust-toolchain@stable
      - run: DEBIAN_FRONTEND=noninteractive apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends at-spi2-core dbus-x11 libxkbcommon-dev x11-utils xdotool xvfb
      - run: xvfb-run --auto-servernum ./scripts/gui-test

  security-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: https://github.com/dtolnay/rust-toolchain@stable
      - run: cargo install cargo-auditable --locked
      - run: cargo auditable build --release
      - run: cargo install cargo-audit --locked
      - run: cargo audit
