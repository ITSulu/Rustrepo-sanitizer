name: CI

on:
  push:
    branches: [main, master, feat/**]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  CARGO_HTTP_TIMEOUT: 180
  CARGO_NET_RETRY: 10

jobs:
  quality:
    runs-on: garuda-16
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: https://github.com/dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: apt-get update && apt-get install -y --no-install-recommends libxkbcommon-dev
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test --all-features
      - run: cargo check --features gui --bin rustrepo-sanitizer-gui

  stable-check:
    runs-on: garuda-16
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: https://github.com/dtolnay/rust-toolchain@stable
      - run: cargo check --all-features
      - run: cargo check --features gui --bin rustrepo-sanitizer-gui

  gui-xa11y:
    runs-on: garuda-16
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: https://github.com/dtolnay/rust-toolchain@stable
      - run: DEBIAN_FRONTEND=noninteractive apt-get update && (DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends at-spi2-core dbus-x11 libx11-6 libx11-xcb1 libxext6 libxfixes3 libxi6 libxkbcommon-dev libxkbcommon-x11-0 libxrender1 libxrandr2 libxcursor1 libxinerama1 openbox systemd x11-utils xauth xdotool xvfb || DEBIAN_FRONTEND=noninteractive apt-get -f install -y)
      - run: xvfb-run --auto-servernum bash -x ./scripts/gui-test

  security-release:
    runs-on: garuda-16
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: https://github.com/dtolnay/rust-toolchain@stable
      - run: cargo install cargo-auditable --locked
      - run: cargo auditable build --release
      - run: cargo install cargo-audit --locked
      - run: cargo audit
