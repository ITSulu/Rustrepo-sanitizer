name: CI

on:
  push:
    branches: [main, master, feat/**]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  CARGO_HTTP_TIMEOUT: 180
  CARGO_NET_RETRY: 10
  FORGEJO_PRIMARY_RUNNER: garuda-16

jobs:
  quality:
    runs-on: garuda-16
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: https://github.com/dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: apt-get update && apt-get install -y --no-install-recommends libxkbcommon-dev
      - run: cargo fmt --check
      # The unified binary links Slint, Leptos/Axum, and reqwest; a cold build
      # needs a generous timeout on the single-runner pool.
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test --all-features
      - run: cargo build --bin Rustrepo-sanitizer

  stable-check:
    runs-on: garuda-16
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: https://github.com/dtolnay/rust-toolchain@stable
      - run: apt-get update && apt-get install -y --no-install-recommends libxkbcommon-dev
      - run: cargo check --all-features
      - run: cargo check --no-default-features
      - run: cargo check --no-default-features --features gui
      - run: cargo check --no-default-features --features web

  gui-xa11y:
    runs-on: garuda-16
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: https://github.com/dtolnay/rust-toolchain@stable
      - run: UCF_FORCE_CONFFOLD=1 DEBIAN_FRONTEND=noninteractive apt-get update && UCF_FORCE_CONFFOLD=1 DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends at-spi2-core dbus-x11 libx11-6 libx11-xcb1 libxext6 libxfixes3 libxi6 libxkbcommon-dev libxkbcommon-x11-0 libxrender1 libxrandr2 libxcursor1 libxinerama1 systemd x11-utils xauth xdotool xvfb
      - run: xvfb-run --auto-servernum bash -x ./scripts/gui-test

  web-ui:
    runs-on: garuda-16
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: https://github.com/dtolnay/rust-toolchain@stable
      - run: apt-get update && apt-get install -y --no-install-recommends libxkbcommon-dev
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Browser coverage of the web UI
        run: npx playwright test
        env:
          RRS_TEST_LOCAL: '1'
          RRS_TEST_REPO: /tmp/rrs-pw-repo

  security-release:
    runs-on: garuda-16
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: https://github.com/dtolnay/rust-toolchain@stable
      - run: apt-get update && apt-get install -y --no-install-recommends libxkbcommon-dev
      - run: cargo install cargo-auditable --locked
      - run: cargo auditable build --release
      - run: cargo install cargo-audit --locked
      - run: cargo audit
