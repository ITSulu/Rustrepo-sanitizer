name: Release artifacts

on:
  push:
    branches: [release-backfill-042]
  workflow_dispatch:
    inputs:
      version:
        required: true
        description: Release version without the v prefix

jobs:
  build:
    runs-on: garuda-16
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-glibc-x86_64, target: x86_64-unknown-linux-gnu, platform: linux-glibc, arch: x86_64 }
          - { name: linux-glibc-aarch64, target: aarch64-unknown-linux-gnu, platform: linux-glibc, arch: aarch64 }
          - { name: linux-musl-x86_64, target: x86_64-unknown-linux-musl, platform: linux-musl, arch: x86_64 }
          - { name: linux-musl-aarch64, target: aarch64-unknown-linux-musl, platform: linux-musl, arch: aarch64 }
          - { name: alpine-x86_64, target: x86_64-unknown-linux-musl, platform: alpine, arch: x86_64 }
          - { name: alpine-aarch64, target: aarch64-unknown-linux-musl, platform: alpine, arch: aarch64 }
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 1, ref: v0.4.2 }
      - name: Install Rust target
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          source "$HOME/.cargo/env"
          rustup toolchain install stable --profile minimal --no-self-update
          rustup target add '${{ matrix.target }}' --toolchain stable
      - run: |
          set -eu
          export PATH="$HOME/.cargo/bin:$PATH"
          test "$(git describe --tags --exact-match HEAD)" = v0.4.2
          test "$(awk -F'\"' '/^version = / {print $2; exit}' Cargo.toml)" = 0.4.2
          apt-get update
          apt-get install -y --no-install-recommends python3-pip
          python3 -m pip install --break-system-packages ziglang
          command -v cargo-zigbuild >/dev/null || cargo install cargo-zigbuild --locked
          cargo zigbuild --locked --release --target '${{ matrix.target }}'
          mkdir -p dist
          if [ '${{ matrix.arch }}' = aarch64 ]; then
            mkdir -p cross-stage
            cp target/${{ matrix.target }}/release/itsulu-repo-sanitizer cross-stage/itsulu-repo-sanitizer
            chmod 0755 cross-stage/itsulu-repo-sanitizer
            tar -C cross-stage -czf "dist/rustrepo-sanitizer-0.4.2-${{ matrix.platform }}-${{ matrix.arch }}.tar.gz" itsulu-repo-sanitizer
            (cd dist && sha256sum $(find . -maxdepth 1 -type f -printf '%f\n' | sort) > SHA256SUMS)
          else
            RELEASE_PLATFORM='${{ matrix.platform }}' RELEASE_ARCH='${{ matrix.arch }}' release/build-artifacts.sh 0.4.2 dist target/${{ matrix.target }}/release/itsulu-repo-sanitizer
          fi
          (cd dist && sha256sum -c SHA256SUMS)
      - uses: actions/upload-artifact@v3
        with:
          name: '${{ matrix.name }}'
          path: dist/

  packages:
    runs-on: garuda-16
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: debian-amd64, format: deb }
          - { name: rpm-x86_64, format: rpm }
          - { name: arch-x86_64, format: arch }
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 1, ref: v0.4.2 }
      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          source "$HOME/.cargo/env"
          rustup toolchain install stable --profile minimal --no-self-update
      - run: |
          set -eu
          export PATH="$HOME/.cargo/bin:$PATH"
          test "$(git describe --tags --exact-match HEAD)" = v0.4.2
          test "$(awk -F'\"' '/^version = / {print $2; exit}' Cargo.toml)" = 0.4.2
          cargo build --locked --release
          mkdir -p dist
          if [ '${{ matrix.format }}' = arch ]; then
            pkgroot="$PWD/arch-root"
            rm -rf "$pkgroot"
            mkdir -p "$pkgroot/usr/bin"
            cp target/release/itsulu-repo-sanitizer "$pkgroot/usr/bin/itsulu-repo-sanitizer"
            chmod 0755 "$pkgroot/usr/bin/itsulu-repo-sanitizer"
            size=$(stat -c '%s' "$pkgroot/usr/bin/itsulu-repo-sanitizer")
            printf '%s\n' \
              'pkgname = rustrepo-sanitizer' \
              'pkgbase = rustrepo-sanitizer' \
              'pkgver = 0.4.2-1' \
              'pkgdesc = Create deterministic, sanitized AI review bundles from Git repositories' \
              'url = https://git.itsulu.com/itsulu/Rustrepo-sanitizer' \
              "builddate = $(date +%s)" \
              'packager = ITSulu release automation' \
              "size = $size" \
              'arch = x86_64' \
              'license = Apache-2.0' \
              'depend = glibc' > "$pkgroot/.PKGINFO"
            tar --zstd -cf "dist/rustrepo-sanitizer-0.4.2-arch-x86_64.pkg.tar.zst" -C "$pkgroot" .PKGINFO usr
            (cd dist && sha256sum *.pkg.tar.zst > SHA256SUMS)
          else
            cargo install cargo-deb cargo-generate-rpm --locked
            RELEASE_PLATFORM=linux RELEASE_ARCH=x86_64 RELEASE_FORMATS='${{ matrix.format }}' release/build-artifacts.sh 0.4.2 dist
          fi
          (cd dist && sha256sum -c SHA256SUMS)
      - uses: actions/upload-artifact@v3
        with:
          name: '${{ matrix.name }}'
          path: dist/

  windows:
    runs-on: garuda-16
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 1, ref: v0.4.2 }
      - name: Install Rust target
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          source "$HOME/.cargo/env"
          rustup toolchain install stable --profile minimal --no-self-update
          rustup target add x86_64-pc-windows-gnu --toolchain stable
      - run: |
          set -eu
          export PATH="$HOME/.cargo/bin:$PATH"
          test "$(git describe --tags --exact-match HEAD)" = v0.4.2
          test "$(awk -F'\"' '/^version = / {print $2; exit}' Cargo.toml)" = 0.4.2
          apt-get update
          apt-get install -y --no-install-recommends python3-pip
          python3 -m pip install --break-system-packages ziglang
          command -v cargo-zigbuild >/dev/null || cargo install cargo-zigbuild --locked
          cargo zigbuild --locked --release --target x86_64-pc-windows-gnu
          mkdir -p dist
          zip -j dist/rustrepo-sanitizer-0.4.2-windows-x86_64.zip target/x86_64-pc-windows-gnu/release/itsulu-repo-sanitizer.exe
          (cd dist && sha256sum *.zip > SHA256SUMS)
      - uses: actions/upload-artifact@v3
        with:
          name: windows-x86_64
          path: dist/

  publish:
    needs: [build, packages, windows]
    runs-on: garuda-16
    steps:
      - uses: actions/download-artifact@v3
        with: { path: dist, merge-multiple: true }
      - uses: actions/checkout@v4
        with: { fetch-depth: 1, ref: v0.4.2 }
      - run: |
          set -eu
          version=0.4.2
          expected="rustrepo-sanitizer-${version}-linux-glibc-x86_64.tar.gz rustrepo-sanitizer-${version}-linux-glibc-aarch64.tar.gz rustrepo-sanitizer-${version}-linux-musl-x86_64.tar.gz rustrepo-sanitizer-${version}-linux-musl-aarch64.tar.gz rustrepo-sanitizer-${version}-linux-amd64.deb rustrepo-sanitizer-${version}-linux-x86_64.rpm rustrepo-sanitizer-${version}-arch-x86_64.pkg.tar.zst rustrepo-sanitizer-${version}-alpine-x86_64.tar.gz rustrepo-sanitizer-${version}-alpine-aarch64.tar.gz rustrepo-sanitizer-${version}-windows-x86_64.zip"
          find dist -type f ! -name SHA256SUMS -print0 | xargs -0 sha256sum | sort -k2 > dist/SHA256SUMS
          actual=$(find dist -maxdepth 1 -type f ! -name SHA256SUMS -printf '%f\n' | sort | tr '\n' ' ')
          wanted=$(printf '%s\n' $expected | sort | tr '\n' ' ')
          test "$actual" = "$wanted"
          RELEASE_EXPECTED_ASSETS="$(printf '%s\n' $expected | tr ' ' ',')" RELEASE_NOTES_FILE=release/0.4.2.md RELEASE_COMMIT="$(git rev-parse v0.4.2)" release/publish-release.sh 0.4.2 dist
        env:
          FORGEJO_TOKEN: ${{ secrets.FORGEJO_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
