[package]
name = "itsulu-repo-sanitizer"
version = "0.3.2"
edition = "2021"
description = "Create deterministic, sanitized AI review bundles from Git repositories"
license = "Apache-2.0"
repository = "https://git.itsulu.com/itsulu/Rustrepo-sanitizer"
readme = "README.md"

[[bin]]
name = "itsulu-repo-sanitizer"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
chrono = "0.4"
clap = { version = "4.5", features = ["derive"] }
flate2 = "1.0"
globset = "0.4"
libc = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tar = "0.4"
zstd = "0.13"
zip = { version = "2.4", default-features = false, features = ["aes-crypto", "deflate", "zstd"] }

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
tempfile = "3.14"

[package.metadata.deb]
maintainer = "ITSulu, LLC"
copyright = "2026, ITSulu, LLC"
extended-description = "Create deterministic, sanitized AI review bundles from Git repositories."
depends = ""
section = "utils"
priority = "optional"
assets = [["target/release/itsulu-repo-sanitizer", "usr/bin/itsulu-repo-sanitizer", "755"]]

[package.metadata.generate-rpm]
assets = [{ source = "target/release/itsulu-repo-sanitizer", dest = "/usr/bin/itsulu-repo-sanitizer", mode = "755" }]

[[bench]]
name = "sanitize"
harness = false
