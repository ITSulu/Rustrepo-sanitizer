[package]
name = "itsulu-repo-sanitizer"
version = "0.4.0"
edition = "2021"
description = "Create deterministic, sanitized AI review bundles from Git repositories"
license = "Apache-2.0"
repository = "https://git.itsulu.com/itsulu/Rustrepo-sanitizer"
readme = "README.md"

[[bin]]
name = "itsulu-repo-sanitizer"
path = "src/main.rs"

[[bin]]
name = "rustrepo-sanitizer-gui"
path = "src/bin/gui.rs"

[dependencies]
anyhow = "1.0"
chrono = "0.4"
clap = { version = "4.5", features = ["derive"] }
flate2 = "1.0"
globset = "0.4"
libc = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tar = "0.4"
zstd = "0.13"
compcol = { version = "0.6.11", default-features = false, features = ["std", "factory", "gzip", "zlib", "xz", "lz4", "snappy", "bzip2", "brotli", "zstd"] }
zip = { version = "2.4", default-features = false, features = ["aes-crypto", "deflate", "zstd"] }
slint = { version = "1.17.1", optional = true }
rfd = { version = "0.15", optional = true }
webbrowser = { version = "1.0", optional = true }

[features]
default = []
gui = ["dep:slint", "dep:rfd", "dep:webbrowser"]

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
tempfile = "3.14"
insta = "1.48"
xa11y = "0.14"
enigo = "0.6"

[build-dependencies]
slint-build = "1.17.1"

[package.metadata.deb]
maintainer = "ITSulu, LLC"
copyright = "2026, ITSulu, LLC"
extended-description = "Create deterministic, sanitized AI review bundles from Git repositories."
depends = ""
section = "utils"
priority = "optional"
assets = [["target/release/itsulu-repo-sanitizer", "usr/bin/itsulu-repo-sanitizer", "755"]]

[package.metadata.generate-rpm]
assets = [{ source = "target/release/itsulu-repo-sanitizer", dest = "/usr/bin/itsulu-repo-sanitizer", mode = "755" }]

[[bench]]
name = "sanitize"
harness = false
