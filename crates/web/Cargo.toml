[package]
name = "itsulu-repo-sanitizer-web"
version = "0.6.0"
edition = "2021"
description = "Axum/Leptos web frontend for Rustrepo-sanitizer"
license = "Apache-2.0"
publish = false

[lib]
name = "itsulu_repo_sanitizer_web"
path = "src/lib.rs"

[[bin]]
name = "rustrepo-sanitizer-web"
path = "src/main.rs"

[dependencies]
itsulu-repo-sanitizer = { path = "../.." }
anyhow = "1.0"
globset = "0.4"
axum = { version = "0.8", features = ["multipart", "macros"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "fs", "time", "sync", "io-util"] }
tokio-util = { version = "0.7", features = ["io"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["limit", "trace"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
tempfile = "3.14"
zip = { version = "2.4", default-features = false, features = ["deflate"] }
zstd = "0.13"
tar = "0.4"
flate2 = "1.0"
uuid = { version = "1", features = ["v4"] }
thiserror = "2"
futures-util = "0.3"
bytes = "1"
include_dir = "0.7"
sha2 = "0.10"
hex = "0.4"
url = "2"
any_spawner = "0.3"
leptos = { version = "0.8", features = ["ssr"] }
leptos_axum = "0.8"
leptos_meta = { version = "0.8", features = ["ssr"] }
leptos_router = { version = "0.8", features = ["ssr"] }

[dev-dependencies]
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
